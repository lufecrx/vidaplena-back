services:
  db:
    image: postgres:16-alpine
    container_name: vidaplena-db
    environment:
      POSTGRES_DB: ${DB_NAME:-vidaplena}
      POSTGRES_USER: ${DB_USER:-vidaplena}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vidaplena_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vidaplena} -d $${POSTGRES_DB:-vidaplena}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vidaplena-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidaplena-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-vidaplena}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-vidaplena}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-vidaplena_secure_password_2026}
      VIDAPLENA_JWT_SECRET: ${JWT_SECRET:-vidaplena-super-secret-production-key-for-jwt-signing-2026}
      VIDAPLENA_JWT_EXPIRATION: ${JWT_EXPIRATION:-PT2H}
      VIDAPLENA_MAIL_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vidaplena-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  vidaplena-network:
    driver: bridge
