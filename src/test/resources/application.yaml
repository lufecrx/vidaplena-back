spring:
  datasource:
    url: jdbc:h2:mem:vidaplena;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  security:
    jwt:
      secret: test-secret-key-test-secret-key-test-secret-key-123456
      expiration: PT1H
  mail:
    enabled: false
  storage:
    upload-dir: target/test-uploads