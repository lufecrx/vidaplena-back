spring:
  application:
    name: vidaplena
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vidaplena}
    username: ${SPRING_DATASOURCE_USERNAME:vidaplena}
    password: ${SPRING_DATASOURCE_PASSWORD:vidaplena}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    jwt:
      secret: ${VIDAPLENA_JWT_SECRET:vidaplena-please-change-this-secret-for-production-2026}
      expiration: ${VIDAPLENA_JWT_EXPIRATION:PT1H}
  cors:
    allowed-origins: ${VIDAPLENA_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:3000}}
  mail:
    enabled: ${VIDAPLENA_MAIL_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none
    default-models-expand-depth: 2
